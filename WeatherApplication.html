<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer" />
    <title>Weather App</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:30px;
    border-radius:15px;
    width:350px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* search bar */

.weather_search{
    display:flex;
    align-items:center;
    gap:10px;
    background:#f1f1f1;
    padding:10px 15px;
    border-radius:30px;
}

.weather_search input{
    border:none;
    outline:none;
    background:transparent;
    font-size:16px;
    width:100%;
}

/* city */

.weather_city{
    text-align:center;
    margin-top:20px;
    font-size:28px;
    font-weight:bold;
}

.weather_date_time{
    text-align:center;
    color:gray;
    margin-top:5px;
}

/* weather main */

.weather_data{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:15px;
}

.weather_temperature{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    margin-top:10px;
}

/* min max */

.weather_minmax{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:14px;
}

/* info cards */

.weather_info{
    margin-top:20px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.weather_card{
    background:#f5f5f5;
    border-radius:10px;
    padding:10px;
    display:flex;
    align-items:center;
    gap:10px;
}

.weather_card i{
    font-size:20px;
    color:#4facfe;
}

.weather_card p:first-child{
    font-size:13px;
    color:gray;
}

.weather_card p:last-child{
    font-weight:bold;
}
    </style>
</head>
<body>
    <section class="container">
        <div class="weather_header">
            <form class="weather_search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="city_name" placeholder="Search your city..">
            </form>
        </div>
        <div class="weather_body">
            <h1 class="weather_city"></h1>
            <p class="weather_date_time"></p>
            <div class="weather_data">
                <p class="weather_forcast"></p>
                <div class="weather_icon"></div>
            </div>
            <p class="weather_temperature"></p>
            <div class="weather_minmax">
                <p class="weather_min"></p>
                <p class="weather_max"></p>
            </div>
        </div>
        <section class="weather_info">
            <div class="weather_card">
                <i class="fa-solid fa-droplet"></i>
                <div>
                    <p>Feels Like</p>
                    <p class="weather_feelslike">15&#176</p>
                </div>
            </div>

            <div class="weather_card">
                <i class="fa-solid fa-droplet"></i>
                <div>
                    <p>Humidity</p>
                    <p class="weather_humidity">15&#176</p>
                </div>
            </div>

            <div class="weather_card">
                <i class="fa-solid fa-wind"></i>
                <div>
                    <p>Wind</p>
                    <p class="weather_wind">15&#176</p>
                </div>
            </div>

            <div class="weather_card">
                <i class="fa-solid fa-gauge-high"></i>
                <div>
                    <p>Pressure</p>
                    <p class="weather_pressure">15&#176</p>
                </div>
            </div>
        </section>
    </section>
    <script src="index.js"></script>
</body>
</html>
